name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    name: Test, build, deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # `build` runs `tsc --noEmit` before vite, so this is the typecheck too.
      #
      # The commit is the one thing a running build cannot work out for itself,
      # and telemetry needs it: without a build stamp on every run, a balance
      # change has no before and after. Nothing else is injected — the Firestore
      # project id is written down in meta/telemetry-send.ts, because it is an
      # address rather than a secret and a static bundle has no secrets anyway.
      - run: pnpm build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OVERCLOCK_GAME }}
          projectId: overclock-game
          channelId: live
